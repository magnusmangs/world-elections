<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Elections</title>
<meta name="description" content="A world map of upcoming national elections, with the parties, leaders and policies in each race.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23B0124F'/><path d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
<a class="skip" href="#calendar">Skip to election calendar</a>

<main>
  <section class="atlas" aria-label="World map of upcoming elections">
    <nav class="sitenav" aria-label="Pages">
      <a href="/" aria-current="page">Kosningar</a>
      <a href="/fjarmal">Fjármál</a>
    </nav>
    <header class="masthead">
      <h1>World elections</h1>
      <p class="lede" id="lede">Loading the calendar…</p>
    </header>

    <div class="map" id="map" role="img" aria-label="World map. Countries with an upcoming national election are coloured by how soon they vote."></div>

    <div class="legend" aria-hidden="true">
      <span class="legend-title">Next vote</span>
      <ol class="legend-scale">
        <li><i style="--c:var(--s1)"></i>Within a month</li>
        <li><i style="--c:var(--s2)"></i>1–3 months</li>
        <li><i style="--c:var(--s3)"></i>3–6 months</li>
        <li><i style="--c:var(--s4)"></i>Later</li>
      </ol>
    </div>

    <div class="map-tools">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" id="zoom-reset" aria-label="Reset map view">Reset</button>
    </div>

    <div class="tooltip" id="tooltip" role="status" hidden></div>
  </section>

  <section class="calendar" id="calendar" aria-labelledby="cal-h">
    <div class="calendar-head">
      <h2 id="cal-h">Election calendar</h2>
      <label class="search">
        <span class="visually-hidden">Find a country</span>
        <input type="search" id="search" placeholder="Find a country" autocomplete="off">
      </label>
    </div>
    <div id="calendar-list"></div>
    <p class="fineprint" id="fineprint"></p>
  </section>
</main>

<aside class="panel" id="panel" aria-labelledby="panel-title" hidden>
  <button type="button" class="panel-close" id="panel-close" aria-label="Close country details">Close</button>
  <div class="panel-body" id="panel-body"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
