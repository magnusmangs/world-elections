<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="World Elections">Kosningar í heiminum</title>
<meta name="description" content="Heimskort yfir væntanlegar þjóðarkosningar með flokkum, leiðtogum og stefnumálum í hverju landi." data-en-content="A world map of upcoming national elections, with the parties, leaders and policies in each race.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="chat.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23B0124F'/><path d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
<a class="skip" href="#calendar" data-en="Skip to election calendar">Fara í kosningadagatal</a>

<main>
  <section class="atlas" aria-label="Heimskort yfir væntanlegar kosningar" data-en-aria-label="World map of upcoming elections">
    <nav class="sitenav" aria-label="Síður" data-en-aria-label="Pages">
      <a href="/frettir" data-en="News">Fréttir</a>
      <a href="/" aria-current="page" data-en="Elections">Kosningar</a>
    </nav>
    <header class="masthead">
      <h1 data-en="World elections">Kosningar í heiminum</h1>
      <p class="lede" id="lede" data-en="Loading the calendar…">Sæki dagatalið…</p>
    </header>

    <div class="map" id="map" role="img" aria-label="Heimskort. Lönd þar sem þjóðarkosningar eru fram undan eru lituð eftir því hve fljótt er kosið. Lönd sem kusu síðustu 90 daga eru lituð eftir því hvort nýr aðili eða sitjandi vann." data-en-aria-label="World map. Countries with an upcoming national election are coloured by how soon they vote. Countries that voted in the last 90 days are coloured by whether a new winner or the incumbent won."></div>

    <div class="legend" aria-hidden="true">
      <div class="legend-group">
        <span class="legend-title" data-en="Next vote">Næst kosið</span>
        <ol class="legend-scale">
          <li><i style="--c:var(--s1)"></i><span data-en="Within a month">Innan mánaðar</span></li>
          <li><i style="--c:var(--s2)"></i><span data-en="1–3 months">1–3 mánuðir</span></li>
          <li><i style="--c:var(--s3)"></i><span data-en="3–6 months">3–6 mánuðir</span></li>
          <li><i style="--c:var(--s4)"></i><span data-en="Later">Síðar</span></li>
        </ol>
      </div>
      <div class="legend-group">
        <span class="legend-title" data-en="Results, last 90 days">Úrslit síðustu 90 daga</span>
        <ul class="legend-scale">
          <li><i style="--c:var(--r-new)"></i><span data-en="New winner">Nýr sigurvegari</span></li>
          <li><i style="--c:var(--r-inc)"></i><span data-en="Incumbent held on">Sitjandi hélt velli</span></li>
        </ul>
      </div>
    </div>

    <div class="map-tools">
      <button type="button" id="zoom-in" aria-label="Þysja inn" data-en-aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Þysja út" data-en-aria-label="Zoom out">−</button>
      <button type="button" id="zoom-reset" aria-label="Endurstilla kortið" data-en-aria-label="Reset map view" data-en="Reset">Endurstilla</button>
    </div>

    <div class="tooltip" id="tooltip" role="status" hidden></div>
  </section>

  <section class="calendar" id="calendar" aria-labelledby="cal-h">
    <div class="calendar-head">
      <h2 id="cal-h" data-en="Election calendar">Kosningadagatal</h2>
      <label class="search">
        <span class="visually-hidden" data-en="Find a country">Finna land</span>
        <input type="search" id="search" placeholder="Finna land" data-en-placeholder="Find a country" autocomplete="off">
      </label>
    </div>
    <div id="calendar-list"></div>
    <p class="fineprint" id="fineprint"></p>
  </section>
</main>

<aside class="panel" id="panel" aria-labelledby="panel-title" hidden>
  <button type="button" class="panel-close" id="panel-close" aria-label="Loka upplýsingum um land" data-en-aria-label="Close country details" data-en="Close">Loka</button>
  <div class="panel-body" id="panel-body"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
</body>
</html>
